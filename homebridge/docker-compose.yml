services:
  homebridge:
    image: homebridge/homebridge:latest
    restart: always
    container_name: homebridge
    network_mode: host
    hostname: HomeMgt  # Optional: Set container hostname
    volumes:
      - homebridge:/homebridge
      - /opt/backup/HomeMgt/homebridge:/backup
    environment:
      - TZ=Europe/Berlin  # Optional: Set your timezone
      - ENABLE_AVAHI=1      # Optional: Enable/disable Avahi (1=enabled, 0=disabled)
    labels:
      - wud.watch=true
      - wud.watch.digest=true
      - wud.trigger.include=dockercompose
        #- wud.trigger.include=dockercompose,telegram
      - wud.trigger.dockercompose.homebridge=true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '1'
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8581 || exit 1"]
      interval: 60s
      retries: 5
      start_period: 300s
      timeout: 2s
volumes:
  homebridge:
    name: homebridge
